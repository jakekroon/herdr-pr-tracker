id = "herdr-pr-tracker"
name = "PR Tracker"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Every open pull request you have authored, docked and colour-coded by what needs you."
platforms = ["macos", "linux"]

# Commands are run directly, not through a shell, so bun is invoked explicitly
# rather than relying on a shebang plus the execute bit.

[[panes]]
id = "prs"
title = "prs"
placement = "split"
command = ["bun", "bin/pane.ts"]
description = "Open PRs you authored, with status"

# Restore the widget after a session restore.
[[startup]]
command = ["bun", "bin/follow.ts"]

# The widget follows you: Herdr has no always-on-top surface, so these hooks
# relocate the single widget pane into whichever tab you enter.
[[events]]
on = "tab.focused"
command = ["bun", "bin/follow.ts"]

[[events]]
on = "workspace.focused"
command = ["bun", "bin/follow.ts"]

# The sidebar `$pr` token for the focused pane's branch. This is the
# responsibility inherited from the gh-pr plugin this one replaces; without it,
# `$pr` in the user's sidebar row config goes blank.
#
# Deliberately not hooked to pane.output_changed, which fires on every output
# burst and would be a hook storm; bin/token.ts throttles per pane on top.
[[events]]
on = "pane.focused"
command = ["bun", "bin/token.ts"]

[[events]]
on = "worktree.opened"
command = ["bun", "bin/token.ts"]

[[events]]
on = "worktree.created"
command = ["bun", "bin/token.ts"]

[[actions]]
id = "refresh"
title = "Refresh PR status"
description = "Fetch the PR list now instead of waiting for the next poll"
contexts = ["global"]
command = ["bun", "bin/refresh.ts"]

[[actions]]
id = "toggle"
title = "Toggle the PR pane"
description = "Show or hide the PR list widget"
contexts = ["global"]
command = ["bun", "bin/toggle.ts"]

# The view action. One toggle rather than two idempotent "show me X" actions,
# because the pane header now names the view you are in ("My PRs" / "Awaiting
# Review", set with `pane report-metadata --title`) — so a control that promises
# a destination would be repeating a fact already on screen, and two controls
# would be two places for it to drift. Two views means "the other one" is
# unambiguous.
#
# It writes the preference and lets the pane process pick it up: the pane owns
# the poll loop, and two processes fetching would race.
[[actions]]
id = "view-toggle"
title = "Toggle PR view"
description = "Switch between the PRs you opened and the ones waiting on your review"
contexts = ["global"]
command = ["bun", "bin/view.ts"]

# The header's view switcher: the dim control in the pane's top line is an
# OSC 8 hyperlink. The pane claims the mouse and acts on a plain click itself,
# so these handlers are the *other* route — Herdr sends a ctrl-click on a
# terminal URL to the first matching handler, which still works in a terminal
# that delivers one (macOS claims ctrl-click as the secondary click, so iTerm2
# does not). They cost nothing where that click never arrives.
#
# The URL is GitHub's own list of exactly the pull requests the view being
# switched *to* shows, so a click that reaches neither route is still not a dead
# end. Both URLs fire the one toggle action, which is correct rather than lossy:
# whichever list you ctrl-clicked is by construction the view you are not in.
#
# `pattern` is a Rust regular expression, so the dots are escaped and both ends
# anchored. Anchoring is what keeps the registration honest: a pattern
# registration is global, and an unanchored one would also claim any longer URL
# that merely contains this one, in any pane, including inside agent output.
[[link_handlers]]
id = "view-authored-link"
title = "Toggle PR view"
pattern = "^https://github\\.com/pulls$"
action = "view-toggle"

[[link_handlers]]
id = "view-inbound-link"
title = "Toggle PR view"
pattern = "^https://github\\.com/pulls/review-requested$"
action = "view-toggle"
