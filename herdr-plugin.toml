id = "herdr-pr-tracker"
name = "PR Tracker"
version = "0.6.0"
min_herdr_version = "0.8.0"
description = "Every open pull request you have authored, docked and colour-coded by what needs you."
platforms = ["macos", "linux"]

# Herdr runs commands without a shell, so each command names `bun`.

[[panes]]
id = "prs"
title = "prs"
placement = "split"
command = ["bun", "bin/pane.ts"]
description = "Open PRs you authored, with status"

# Restore the widget after a session restore.
[[startup]]
command = ["bun", "bin/follow.ts"]

# Herdr has no always-on-top surface, so these hooks move the widget into the
# tab you enter.
[[events]]
on = "tab.focused"
command = ["bun", "bin/follow.ts"]

[[events]]
on = "workspace.focused"
command = ["bun", "bin/follow.ts"]

# The sidebar `$pr` token for the focused pane's branch. Do not hook
# pane.output_changed: it fires on every output burst.
[[events]]
on = "pane.focused"
command = ["bun", "bin/token.ts"]

[[events]]
on = "worktree.opened"
command = ["bun", "bin/token.ts"]

[[events]]
on = "worktree.created"
command = ["bun", "bin/token.ts"]

[[actions]]
id = "refresh"
title = "Refresh PR status"
description = "Fetch the PR list now instead of waiting for the next poll"
contexts = ["global"]
command = ["bun", "bin/refresh.ts"]

[[actions]]
id = "toggle"
title = "Toggle the PR pane"
description = "Show or hide the PR list widget"
contexts = ["global"]
command = ["bun", "bin/toggle.ts"]

# Writes the view marker for the pane process to pick up. The pane owns the
# poll loop, so a second fetching process would race it.
[[actions]]
id = "view-toggle"
title = "Toggle PR view"
description = "Switch between the PRs you opened and the ones waiting on your review"
contexts = ["global"]
command = ["bun", "bin/view.ts"]

# The header's view switcher is an OSC 8 link. The pane handles a plain click
# itself; these handlers catch a ctrl-click in terminals that deliver one
# (iTerm2 does not). Either URL is the view you are not in, so both toggle.
#
# `pattern` is a Rust regex. Keep it anchored: a registration is global, and an
# unanchored one claims longer URLs in every pane.
[[link_handlers]]
id = "view-authored-link"
title = "Toggle PR view"
pattern = "^https://github\\.com/pulls$"
action = "view-toggle"

[[link_handlers]]
id = "view-inbound-link"
title = "Toggle PR view"
pattern = "^https://github\\.com/pulls/review-requested$"
action = "view-toggle"
